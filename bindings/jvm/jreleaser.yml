project:
  name: vinary-tree-interop
  version: 4.0.0-rc.6
  description: A stable, dependency-free resource ABI for sharing live dictionaries, weighted automata, and host-defined algebra safely across Vinary Tree libraries and languages.
  authors:
    - Dylon Edwards
  license: Apache-2.0
  links:
    homepage: https://github.com/vinary-tree/vinary-tree-interop
  languages:
    java:
      groupId: io.vinarytree
      artifactId: vinary-tree-interop

signing:
  pgp:
    active: RELEASE
    armored: true

deploy:
  maven:
    mavenCentral:
      sonatype:
        active: RELEASE
        url: https://central.sonatype.com/api/v1/publisher
        authorization: BASIC
        applyMavenCentralRules: true
        namespace: io.vinarytree
        stagingRepositories:
          - build/staging-deploy
