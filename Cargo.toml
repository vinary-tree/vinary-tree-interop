[package]
name = "vinary-tree-interop"
version = "4.0.0-rc.6"
edition = "2021"
rust-version = "1.95"
authors = ["Dylon Edwards <dylon.devo@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/vinary-tree/vinary-tree-interop"
description = "A stable, dependency-free resource ABI for sharing live dictionaries, weighted automata, and host-defined algebra safely across Vinary Tree libraries and languages."
keywords = ["ffi", "bindings", "abi", "vinary-tree"]
categories = ["api-bindings", "development-tools::ffi"]
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[lib]
name = "vinary_tree_interop"
path = "src/lib.rs"

[features]
default = []

# Keep this standalone repository from being captured by an unrelated parent
# workspace when it is checked out beneath another Rust project for validation.
[workspace]
