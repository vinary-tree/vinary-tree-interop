---
name: Verify shared interop ABI

"on":
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Rust, C, C++, JavaScript, Python, and Go contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@1.95
        with: {components: "rustfmt, clippy"}
      - uses: actions/setup-node@v6
        with: {node-version: "24", package-manager-cache: false}
      - uses: actions/setup-go@v6
        with: {go-version: "1.26.x", cache: false}
      - run: shellcheck scripts/verify.sh scripts/verify-python-package.sh
      - run: ./scripts/verify.sh

  byte-values-formal:
    name: Byte-value v2 finite model and invariant mutations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - name: Fetch exact TLA+ tools artifact
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" \
            | sha256sum -c -
      - run: python3 scripts/generate-byte-values-v2-properties.py --check
      - run: python3 scripts/verify-byte-values-v2-formal.py --tlc-jar "$RUNNER_TEMP/tla2tools.jar"

  python:
    name: Python ${{ matrix.python-version }} hosted providers
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14", "3.14t"]
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: "${{ matrix.python-version }}"}
      - name: Install pinned Python static-analysis tools
        if: matrix.python-version == '3.14'
        run: >-
          python -m pip install
          bandit==1.9.4 pyright==1.1.411 ruff==0.16.5
      - name: Type-check, lint, format-check, and security-audit the facade
        if: matrix.python-version == '3.14'
        run: |
          ruff format --check bindings/python
          ruff check bindings/python
          pyright -p bindings/python
          bandit -q -r bindings/python/src/vinary_tree_interop
          bandit -q -r bindings/python/examples
      - name: Test dictionary, WFST, lattice, and semiring providers
        env:
          PYTHONPATH: bindings/python/src
        run: |
          python -m unittest discover -s bindings/python/tests -v
          python bindings/python/examples/host_providers.py

  jvm:
    name: JVM FFM package (${{ matrix.os }}, Java ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, java: "22"}
          - {os: ubuntu-24.04, java: "25"}
          - {os: macos-15, java: "22"}
          - {os: windows-2025, java: "22"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "${{ matrix.java }}"}
      - uses: gradle/actions/setup-gradle@v5
      - run: >-
          bindings/jvm/gradlew --no-daemon -p bindings/jvm
          -PjavaToolchain=${{ matrix.java }} check javadoc
        shell: bash
      - name: Read back public Javadoc types and compiled Kotlin/Scala consumers
        run: >-
          python3 scripts/check-managed-api-docs.py jvm
          bindings/jvm/build/docs/javadoc

  dotnet:
    name: .NET package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@v5
        with: {dotnet-version: 10.0.x}
      - run: >-
          dotnet build
          bindings/dotnet/src/VinaryTree.Interop/VinaryTree.Interop.csproj
          --configuration Release -p:NuGetAudit=false -m:1
      - name: Compile F# provider fixture and generate strict browsable DocFX
        run: |
          dotnet build bindings/dotnet/tests/VinaryTree.Interop.FSharpProviders/VinaryTree.Interop.FSharpProviders.fsproj --configuration Release -p:NuGetAudit=false -m:1
          dotnet tool restore
          dotnet tool run docfx -- docs/api/dotnet/docfx.json --warningsAsErrors
          python3 scripts/check-managed-api-docs.py dotnet target/managed-api-docs/dotnet

  native-languages:
    name: ${{ matrix.language }} package
    strategy:
      fail-fast: false
      matrix:
        language: [fortran, haskell, ocaml, swift]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: fortran-lang/setup-fpm@v10
        if: matrix.language == 'fortran'
      - uses: haskell-actions/setup@v2
        if: matrix.language == 'haskell'
        with: {ghc-version: "9.14.1", cabal-version: latest}
      - uses: ocaml/setup-ocaml@v3
        if: matrix.language == 'ocaml'
        with: {ocaml-compiler: "5.4.0"}
      - name: Install the declared OCaml build dependencies
        if: matrix.language == 'ocaml'
        run: opam install ./bindings/ocaml --deps-only --with-test
      - name: Report the GitHub runner's Swift toolchain
        if: matrix.language == 'swift'
        run: swift --version
      - run: fpm test -C bindings/fortran
        if: matrix.language == 'fortran'
      - run: cabal check
        if: matrix.language == 'haskell'
        working-directory: bindings/haskell
      - run: opam exec -- dune build --root bindings/ocaml @install @runtest
        if: matrix.language == 'ocaml'
      - run: swift build
        if: matrix.language == 'swift'
      - name: Generate and read back strict Swift DocC
        if: matrix.language == 'swift'
        run: |
          mkdir -p target/managed-api-docs
          swift package \
            --package-path bindings/swift/vinary-tree-interop \
            --allow-writing-to-directory "$GITHUB_WORKSPACE/target/managed-api-docs/swift" \
            generate-documentation \
            --target VinaryTreeInterop \
            --disable-indexing \
            --warnings-as-errors \
            --transform-for-static-hosting \
            --hosting-base-path vinary-tree-interop \
            --output-path "$GITHUB_WORKSPACE/target/managed-api-docs/swift"
          python3 scripts/check-managed-api-docs.py swift \
            target/managed-api-docs/swift --complete-toolchain-assets

  julia:
    name: Julia ${{ matrix.julia-version }} package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.10", "1.12"]
    steps:
      - uses: actions/checkout@v6
        # Julia 1.10's LibGit2 cannot clone a local shallow checkout when
        # Pkg.add selects the checked-out commit as a Git dependency.
        with: {persist-credentials: false, fetch-depth: 0}
      # yamllint disable-line rule:line-length
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32  # v3.0.2
        with: {version: "${{ matrix.julia-version }}"}
      - name: Test the Julia ABI, collections, reducers, and WFST facade
        run: >-
          julia --startup-file=no --project=bindings/julia/VinaryTreeInterop
          -e 'using Pkg; Pkg.test()'
      - name: Fresh Git-installed Julia consumer and native fixture
        run: |
          package="bindings/julia/VinaryTreeInterop"
          scratch="$PWD/$package/test/target"
          mkdir -p "$scratch"
          TMPDIR="$scratch" julia --startup-file=no \
            "$package/test/installed_consumer.jl" "$scratch"
      - name: Build strict doctested Julia API documentation
        working-directory: bindings/julia/VinaryTreeInterop
        run: >-
          julia --startup-file=no --project=docs
          -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate();
          include("docs/make.jl")'

  raku:
    name: Raku NativeCall package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      # yamllint disable-line rule:line-length
      - uses: Raku/setup-raku@b8b1a4ebe85ef112edfc65e9edc8c57735367e3f  # v1
      - name: Reject generated ABI declaration and capability drift
        run: |
          raku scripts/generate-bindings.raku --check
          raku scripts/generate-bindings.raku --self-test
      - name: Build the independent native ABI fixture
        run: >-
          cc -std=c11 -Wall -Wextra -Werror -fPIC -shared
          -Iinclude bindings/raku/t/mock-resource.c
          -o bindings/raku/libvinary_tree_interop_test.so
      - name: Test NativeCall layouts, collections, reducers, and WFSTs
        env:
          # yamllint disable-line rule:line-length
          VINARY_TREE_INTEROP_TEST_LIB: ${{ github.workspace }}/bindings/raku/libvinary_tree_interop_test.so
        run: |
          raku -Ibindings/raku/lib bindings/raku/t/01-layout.rakutest
          raku -Ibindings/raku/lib bindings/raku/t/02-resource.rakutest
          raku -Ibindings/raku/lib bindings/raku/t/03-native-layout.rakutest
