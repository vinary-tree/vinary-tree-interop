name: Release shared interop ABI

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Publish one registry from an immutable release tag
        required: true
        type: choice
        default: validate-only
        options:
          - validate-only
          - npm
          - crates-io
          - pypi
          - maven-central
          - nuget
          - go-module
          - opam

permissions:
  contents: read

jobs:
  contract:
    name: Validate release identity and contracts
    runs-on: ubuntu-24.04
    outputs:
      canonical: ${{ steps.version.outputs.canonical }}
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@1.95
        with: { components: "rustfmt, clippy" }
      - uses: actions/setup-node@v6
        with: { node-version: "24", package-manager-cache: false }
      - uses: actions/setup-go@v6
        with: { go-version: "1.26.x", cache: false }
      - id: version
        name: Validate canonical version, immutable source tag, and registry scope
        shell: bash
        env:
          REGISTRY: ${{ inputs.registry }}
        run: |
          python3 scripts/sync-release-version.py
          canonical=$(python3 scripts/check-release-ref.py \
            --ref "$GITHUB_REF" \
            --ref-name "$GITHUB_REF_NAME" \
            --registry "$REGISTRY")
          echo "canonical=$canonical" >> "$GITHUB_OUTPUT"
      - run: ./scripts/verify.sh

  rust-package:
    name: Rust crate artifact
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@1.95
      - run: cargo package --locked
      - uses: actions/upload-artifact@v7
        with:
          name: rust-package
          path: target/package/*.crate
          if-no-files-found: error

  native-package:
    name: Header-only C and C++ package
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - run: ./scripts/stage-native-package.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: native-package
          path: dist/*.tar.gz
          if-no-files-found: error

  python-package:
    name: Python package
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-python@v6
        with: { python-version: "3.14" }
      - run: python -m pip install build
      - run: python -m build --wheel --sdist --outdir "$GITHUB_WORKSPACE/dist"
        working-directory: bindings/python
      - run: python -m pip install dist/*.whl
      - run: python -c 'from vinary_tree_interop import UnitDomain; assert UnitDomain.UNICODE_SCALAR.value == 2'
      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error

  npm-package:
    name: JavaScript interop package
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "24", package-manager-cache: false }
      - run: npm test
        working-directory: bindings/javascript
      - name: Pack the JavaScript interop artifact
        working-directory: bindings/javascript
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          npm pack --pack-destination "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: dist/*.tgz
          if-no-files-found: error

  jvm-package:
    name: JVM package
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "25" }
      - uses: gradle/actions/setup-gradle@v5
      - run: >-
          bindings/jvm/gradlew --no-daemon -p bindings/jvm
          -PjavaToolchain=25 test javadoc
          publishMavenJavaPublicationToStagingRepository
      - uses: actions/upload-artifact@v7
        with:
          name: maven-package
          path: bindings/jvm/build/staging-deploy
          if-no-files-found: error

  nuget-package:
    name: NuGet package
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: 10.0.x }
      - run: >-
          dotnet pack bindings/dotnet/src/VinaryTree.Interop/VinaryTree.Interop.csproj
          --configuration Release --output dist -p:NuGetAudit=false -m:1
      - uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: dist/*.nupkg
          if-no-files-found: error

  opam-package:
    name: opam source package
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: ocaml/setup-ocaml@v3
        with: { ocaml-compiler: "5.4.0" }
      - run: ./scripts/stage-ocaml-package.sh dist
      - run: opam lint dist/opam
      - uses: actions/upload-artifact@v7
        with:
          name: opam-package
          path: |
            dist/opam
            dist/*.tbz
          if-no-files-found: error

  hackage-candidate:
    name: Hackage final-version candidate (never published for RC)
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: haskell-actions/setup@v2
        with: { ghc-version: "9.14.1", cabal-version: latest }
      - run: cabal check
        working-directory: bindings/haskell
      - run: cabal sdist --ignore-project --output-directory="$GITHUB_WORKSPACE/dist"
        working-directory: bindings/haskell
      - uses: actions/upload-artifact@v7
        with:
          name: hackage-candidate
          path: dist/*.tar.gz
          if-no-files-found: error

  fpm-candidate:
    name: fpm final-version candidate (never published for RC)
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: fortran-lang/setup-fpm@v10
      - run: fpm test -C bindings/fortran
      - uses: actions/upload-artifact@v7
        with:
          name: fpm-candidate
          path: |
            bindings/fortran/fpm.toml
            bindings/fortran/src
          if-no-files-found: error

  publish-crates-io:
    name: Publish crates.io
    needs: [contract, rust-package, native-package, python-package, npm-package, jvm-package, nuget-package, opam-package, hackage-candidate, fpm-candidate]
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && inputs.registry == 'crates-io'
    runs-on: ubuntu-24.04
    environment: crates-io-interop
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@1.95
      - run: cargo publish --locked
        env: { CARGO_REGISTRY_TOKEN: "${{ secrets.CARGO_REGISTRY_TOKEN }}" }

  publish-pypi:
    name: Publish PyPI
    needs: [contract, python-package]
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && inputs.registry == 'pypi'
    runs-on: ubuntu-24.04
    environment: pypi-interop
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v7
        with: { name: python-package, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1.14
        with: { packages-dir: dist }

  publish-npm:
    name: Publish npm under next
    needs: [contract, npm-package]
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && inputs.registry == 'npm'
    runs-on: ubuntu-24.04
    environment: npm
    permissions: { id-token: write }
    steps:
      - uses: actions/setup-node@v6
        with: { node-version: "24", registry-url: "https://registry.npmjs.org", package-manager-cache: false }
      - uses: actions/download-artifact@v7
        with: { name: npm-package, path: dist }
      - run: npm publish --access public --provenance --tag next ./dist/*.tgz

  publish-maven-central:
    name: Publish Maven Central
    needs: [contract, jvm-package]
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && inputs.registry == 'maven-central'
    runs-on: ubuntu-24.04
    environment: maven-central-interop
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/download-artifact@v7
        with: { name: maven-package, path: bindings/jvm/build/staging-deploy }
      - name: Assert the canonical Vinary Tree Maven coordinate
        run: >-
          test -d
          bindings/jvm/build/staging-deploy/io/vinarytree/vinary-tree-interop
      - uses: jreleaser/release-action@v2
        with:
          version: 1.25.0
          arguments: deploy --git-root-search --deployer-name sonatype
          working-directory: bindings/jvm
        env:
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.MAVEN_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.MAVEN_GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  publish-nuget:
    name: Publish NuGet
    needs: [contract, nuget-package]
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && inputs.registry == 'nuget'
    runs-on: ubuntu-24.04
    environment: nuget-interop
    steps:
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: 10.0.x }
      - uses: actions/download-artifact@v7
        with: { name: nuget-package, path: dist }
      - run: >-
          dotnet nuget push dist/VinaryTree.Interop.*.nupkg
          --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
        env: { NUGET_API_KEY: "${{ secrets.NUGET_API_KEY }}" }

  go-module-tag:
    name: Create Go v4 module tag
    needs: [contract, rust-package, native-package, python-package, npm-package, jvm-package, nuget-package, opam-package, hackage-candidate, fpm-candidate]
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && inputs.registry == 'go-module'
    runs-on: ubuntu-24.04
    environment: go-module-interop
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - name: Create the immutable subdirectory module tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.contract.outputs.canonical }}
        run: |
          module_tag="bindings/go/v$VERSION"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" --method POST \
            -f "ref=refs/tags/$module_tag" -f "sha=$GITHUB_SHA"

  github-release:
    name: Publish checksummed GitHub release
    needs: [contract, rust-package, native-package, python-package, npm-package, jvm-package, nuget-package, opam-package, hackage-candidate, fpm-candidate]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref_type == 'tag' &&
      inputs.registry == 'validate-only'
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v7
        with: { path: staged-assets, merge-multiple: true }
      - name: Flatten release assets and create a directly verifiable checksum manifest
        shell: bash
        run: |
          mkdir release-assets
          while IFS= read -r -d '' source; do
            name=${source##*/}
            if [[ -e "release-assets/$name" ]]; then
              echo "::error::release asset basename collision: $name" >&2
              exit 1
            fi
            cp "$source" "release-assets/$name"
          done < <(find staged-assets -type f -print0 | sort -z)
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | \
            sort -z | xargs -0 -r sha256sum > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

  publish-opam-repository:
    name: Submit package to opam-repository
    needs: [contract, opam-package]
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && inputs.registry == 'opam'
    runs-on: ubuntu-24.04
    environment: opam-interop
    steps:
      - uses: actions/download-artifact@v7
        with: { name: opam-package, path: dist }
      - name: Create the opam-repository pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.OPAM_GITHUB_TOKEN }}
          VERSION: ${{ needs.contract.outputs.canonical }}
        run: |
          account=$(gh api user --jq .login)
          if ! gh repo view "$account/opam-repository" >/dev/null 2>&1; then
            gh repo fork ocaml/opam-repository --clone=false
          fi
          for attempt in 1 2 3 4 5 6; do
            if gh repo view "$account/opam-repository" >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep 5
          done
          gh repo clone "$account/opam-repository" opam-repository
          git -C opam-repository fetch https://github.com/ocaml/opam-repository.git master
          branch="vinary-tree-interop-$VERSION-$GITHUB_RUN_ID"
          git -C opam-repository checkout -b "$branch" FETCH_HEAD
          package="opam-repository/packages/vinary-tree-interop/vinary-tree-interop.$VERSION"
          mkdir -p "$package"
          cp dist/opam "$package/opam"
          git -C opam-repository config user.name "Vinary Tree release automation"
          git -C opam-repository config user.email "dylon.devo@gmail.com"
          git -C opam-repository add "packages/vinary-tree-interop/vinary-tree-interop.$VERSION/opam"
          git -C opam-repository commit -m "Package vinary-tree-interop $VERSION"
          git -C opam-repository push origin "$branch"
          gh pr create --repo ocaml/opam-repository \
            --base master --head "$account:$branch" \
            --title "Package vinary-tree-interop $VERSION" \
            --body "Automated submission of the tested Vinary Tree interop bindings."
